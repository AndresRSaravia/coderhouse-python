{% extends "blogs_django/base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-lg mt-8">
    <h1 class="text-2xl font-bold mb-6 text-indigo-400">Crear cuenta</h1>
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
            <div class="flex flex-col space-y-1">
                <label for="{{ field.id_for_label }}" class="text-sm font-medium text-gray-300">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}<span class="text-xs text-red-400">{{ error }}</span>{% endfor %}
            </div>
        {% endfor %}
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-lg transition-colors shadow-md">
            Registrarme
        </button>
    </form>
    <p class="mt-4 text-sm text-gray-400">¿Ya tienes cuenta? <a href="{% url 'login' %}" class="text-indigo-400 hover:underline">Iniciar sesión</a></p>
</div>
{% endblock content %}
