{% extends "blogs_django/base.html" %}
{% block titulo %} Crear cuenta {% endblock %}
{% block contenido %}
<h1>Crear cuenta</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Registrarme</button>
</form>
<p>Ya tenes cuenta? <a href="{% url 'login' %}">Iniciar sesión</a></p>
{% endblock %}
