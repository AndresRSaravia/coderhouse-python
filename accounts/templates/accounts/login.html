{% extends "blogs_django/base.html" %}
{% block title %} Ingresar {% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6 text-indigo-400">Ingresar</h1>
{% if next %}<p>Necesitas iniciar sesión para ver esta página</p>{% endif %}
<form method="POST" class="space-y-5">
	{% csrf_token %}
    {{ form.as_p }}
	<button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-lg transition-colors shadow-md">Ingresar</button>
</form>
{% endblock content %}
