<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- MENÚ DE NAVEGACIÓN -->
    <header class="bg-gray-900/80 backdrop-blur-md border-b border-gray-800 sticky top-0 z-10">
        <nav class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-xl font-bold tracking-tight text-indigo-400 hover:text-indigo-300 transition-colors">
                <a href="{% url 'blogs_django:index' %}">Mi Blog</a>
            </div>
            <div class="space-x-6 font-medium text-sm">
                <a href="{% url 'blogs_django:index' %}" class="text-gray-300 hover:text-indigo-400 transition-colors">Home</a>
                <a href="{% url 'blogs_django:tags' %}" class="text-gray-300 hover:text-indigo-400 transition-colors">Tags</a>
                <a href="{% url 'blogs_django:posts' %}" class="text-gray-300 hover:text-indigo-400 transition-colors">Posts</a>
				{% if user.is_authenticated %}
                <a href="{% url 'blogs_django:create_post' %}" class="text-gray-300 hover:text-indigo-400 transition-colors">Crear un post</a>
				{% endif %}
				<span class="session">
					{% if user.is_authenticated %} Hola, {{user.username}}
					<form method="post" action="{% url 'logout' %}" class="inline">
						{% csrf_token %}<button type="submit">Salir</button>
					</form>
					{% else %}
					<a href="{% url 'login' %}">Ingresar</a>
					<a href="{% url 'register' %}">Registrarse</a>
					{% endif %}
				</span>
				
            </div>
        </nav>
    </header>

    <!-- CONTENIDO DINÁMICO -->
    <main class="max-w-4xl w-full mx-auto px-6 py-8 flex-grow">
        {% block content %}
        {% endblock content %}
    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="bg-gray-900 border-t border-gray-800 py-4 text-center text-sm text-gray-500">
        <p>&copy; 2026 Mi Blog - Creado con Django</p>
    </footer>

</body>
</html>
